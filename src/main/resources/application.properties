spring.application.name=gard-service

server.port=8080

management.endpoints.web.exposure.include=health,info

spring.datasource.url=jdbc:mariadb://localhost:3306/garddb
spring.datasource.username=gard
spring.datasource.password=gardpass
spring.jpa.hibernate.ddl-auto=update

spring.kafka.bootstrap-servers=localhost:29092
spring.kafka.consumer.group-id=gard-service
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

spring.kafka.listener.ack-mode=manual_immediate

spring.data.redis.host=localhost
spring.data.redis.port=6379

ograd.choose.wait-seconds=60
ograd.status.poll-interval-seconds=10
ograd.status.max-wait-seconds=300

ograd.http.base-url=https://httpbin.org
ograd.http.delay-seconds=1

spring.task.scheduling.pool.size=4